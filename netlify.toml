[build]
  command = "npm run build"
  publish = "dist"

# Per-event link previews for WhatsApp, iMessage, Facebook and friends.
#
# Edge functions run BEFORE the redirects below, so this needs no change to
# the redirect ordering that the /fall comment warns about. The function
# returns early for everything except a link crawler asking for "/?event=<id>",
# so real visitors fall straight through to the app.
[[edge_functions]]
  path = "/"
  function = "og-preview"

# Clean URL for the fall landing page.
# This MUST stay above the catch-all below: Netlify applies the first
# matching rule, so /fall would otherwise be swallowed by /* and serve
# the React app instead of the landing page.
[[redirects]]
  from = "/fall"
  to = "/fall.html"
  status = 200

# Halloween city maps (Oct 27, 2026). These used to be nine static HTML
# pages; the map now lives inside the app, on the Halloween pill, like Pumpkin
# Patches. The short links stay alive and forward into the app with the city
# picked and the map open. src=share lets analytics count the arrival.
# 302, not 301, so the destination can change without browsers caching it.
# These MUST stay above the /* catch-all.
[[redirects]]
  from = "/halloween/sunnyvale"
  to = "/?view=halloween&map=1&city=Sunnyvale&src=share"
  status = 302
  force = true

[[redirects]]
  from = "/halloween/san-jose"
  to = "/?view=halloween&map=1&city=San%20Jose&src=share"
  status = 302
  force = true

